<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - AI创富</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 1.8em; }
        p { color: #666; margin-bottom: 25px; line-height: 1.6; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1em; margin-bottom: 15px; transition: border 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.95em; }
        .success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #667eea; text-decoration: none; font-size: 0.95em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 重置密码</h1>
        <p>请输入新密码</p>
        <div id="message"></div>
        <form id="resetForm">
            <input type="password" id="password" placeholder="新密码（至少6位）" required minlength="6">
            <input type="password" id="confirmPassword" placeholder="确认新密码" required>
            <button type="submit" id="submitBtn">重置密码</button>
        </form>
        <div class="back-link">
            <a href="index.html">← 返回首页</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('message').innerHTML = '<div class="error">❌ 重置链接无效</div>';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');

            if (password !== confirmPassword) {
                msg.innerHTML = '<div class="error">❌ 两次密码不一致</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = '处理中...';

            try {
                const res = await fetch('https://aiopenfortune.com/api/password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();

                if (data.success) {
                    msg.innerHTML = '<div class="success">✅ 密码重置成功！3秒后跳转登录...</div>';
                    setTimeout(() => window.location.href = 'index.html', 3000);
                } else {
                    msg.innerHTML = `<div class="error">❌ ${data.error || '重置失败'}</div>`;
                    btn.disabled = false;
                    btn.textContent = '重置密码';
                }
            } catch (err) {
                msg.innerHTML = '<div class="error">❌ 网络错误，请重试</div>';
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        });
    </script>
</body>
</html>
